name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint add-on config
        uses: frenck/action-addon-linter@v2
        with:
          path: ./t3code
      - name: ShellCheck
        run: |
          shellcheck -s bash \
            t3code/rootfs/usr/local/bin/* \
            t3code/rootfs/etc/s6-overlay/s6-rc.d/t3code/run \
            t3code/rootfs/etc/s6-overlay/s6-rc.d/t3code/finish

  build:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - name: Test build (${{ matrix.arch }})
        uses: home-assistant/builder@2025.03.0
        with:
          args: |
            --test \
            --${{ matrix.arch }} \
            --target /data/t3code
