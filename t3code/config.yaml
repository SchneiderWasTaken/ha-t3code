name: T3 Code
version: "0.2.0"
slug: t3code
description: >-
  A web UI for coding agents (Claude Code, Codex, OpenCode, ...) with your
  Home Assistant configuration as its workspace.
url: https://github.com/SchneiderWasTaken/ha-t3code/tree/main/t3code
# Prebuilt by CI (.github/workflows/ci.yaml); HA pulls instead of building.
image: ghcr.io/schneiderwastaken/{arch}-addon-t3code
arch:
  - aarch64
  - amd64
# s6-overlay from the HA base image is PID 1.
init: false

# Opens in the Home Assistant sidebar. Home Assistant handles sign-in; the
# gateway gives each user their own T3 Code and signs them in to it.
# The gateway listens on the default ingress port, 8099. The panel is
# admin-only (the default) until per-user sandboxes land; the gateway checks
# again on every request (docs/ARCHITECTURE.md).
ingress: true
panel_icon: mdi:robot-outline
panel_title: T3 Code

# Optional direct port for the T3 phone apps or Tailscale. Closed unless you
# set a port in the add-on's Network section and `direct_access_user`.
ports:
  3773/tcp: null
ports_description:
  3773/tcp: Direct T3 Code access (phone apps, Tailscale), uses T3 pairing

# Exposes SUPERVISOR_TOKEN and the http://supervisor/core/api proxy, which
# the agent helpers and the Home Assistant MCP wiring use.
homeassistant_api: true

map:
  - type: homeassistant_config
    read_only: false
  - type: share
    read_only: false
  - type: addon_config
    read_only: false

options:
  log_level: info
  telemetry: false
  homeassistant_mcp: true
  agent_context: true
  extra_apt_packages: []
  extra_npm_packages: []
  env_vars: []

schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  direct_access_user: str?
  telemetry: bool
  homeassistant_mcp: bool
  agent_context: bool
  extra_apt_packages:
    - str
  extra_npm_packages:
    - str
  env_vars:
    - name: match(^[A-Za-z_][A-Za-z0-9_]*$)
      value: str
